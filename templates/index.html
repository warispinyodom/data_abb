<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการไฟล์ | File Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold text-primary"><i class="bi bi-folder-fill"></i> ระบบจัดการไฟล์ข้อมูล</h2>
            <p class="text-muted">อัปโหลด ลบไฟล์ และดูแดชบอร์ดแสดงผลข้อมูล (รองรับไฟล์ข้อความ เช่น HR DATA.txt)</p>
        </div>
    </div>

    <div class="row">
        <!-- ฟอร์มอัปโหลด -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white fw-bold">
                    <i class="bi bi-cloud-arrow-up"></i> อัปโหลดไฟล์ใหม่
                </div>
                <div class="card-body d-flex flex-column justify-content-center">
                    <form method="POST" enctype="multipart/form-data" action="/">
                        <div class="mb-3">
                            <input class="form-control" type="file" name="file" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">อัปโหลดไฟล์</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- รายการไฟล์ -->
        <div class="col-md-8 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-dark text-white fw-bold">
                    <i class="bi bi-list-ul"></i> รายการไฟล์ในระบบ
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        {% for f in files %}
                            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                                <span class="fw-semibold"><i class="bi bi-file-text me-2 text-secondary"></i> {{ f }}</span>
                                <div class="btn-group" role="group">
                                    <a href="{{ url_for('dashboard', filename=f) }}" class="btn btn-sm btn-info text-white" title="ดูตารางและกรองข้อมูล"><i class="bi bi-table"></i> Dashboard</a>
                                    <a href="{{ url_for('delete_file', filename=f) }}" class="btn btn-sm btn-danger" onclick="return confirm('แน่ใจหรือไม่ที่จะลบไฟล์ {{ f }} ?');" title="ลบไฟล์"><i class="bi bi-trash"></i> ลบ</a>
                                </div>
                            </li>
                        {% else %}
                            <li class="list-group-item text-center p-4 text-muted">
                                ยังไม่มีไฟล์ในระบบ กรุณาอัปโหลด
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
